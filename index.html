<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test - 1st Quarter</title>
    <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" 
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
    
    <h1>OBMC Cafeteria Menu</h1>

    <br>

    <input type="checkbox" id="chicken pops"><label for="chicken pops">Chicken Pops</label>
    <br>
    <input type="checkbox" id="cheese sticks"><label for="cheese sticks">Cheese Sticks</label>
    <br>
    <input type="checkbox" id="spam musubi"><label for="spam musubi">Spam Musubi</label>
    <br>
    <input type="checkbox" id="mango float"><label for="mango float">Mango Float</label>
    <br>
    <input type="checkbox" id="blueberry"><label for="blueberry">Blueberry Cheesecake</label>
    <br>
    <input type="checkbox" id="magnum"><label for="magnum">Magnum Ice Cream</label>
    <br>
    <br>

    <button type="submit" py-click="order">Confirm Order</button>

    <br>

    <div id="receipt">Receipt</div>
    <br>
    <div id="Subtotal"></div>
    <br>
    <div id="VAT"></div>
    <br>
    <div id="Total Amount"></div>

    <script type="py" src="main.py"></script>

</body>
</html>
